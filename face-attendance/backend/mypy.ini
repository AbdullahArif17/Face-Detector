[mypy]
python_version = 3.11
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
exclude = app/services/whatsapp.py,app/core/security.py,app/seed.py,app/reset_demo_data.py,app/set_demo_parent_phone.py,app/routers/webhooks.py

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-starlette.*]
ignore_missing_imports = true