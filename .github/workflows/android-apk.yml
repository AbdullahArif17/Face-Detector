name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: face-attendance/frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          emulator: false

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        working-directory: face-attendance/frontend
        run: npm ci

      - name: Build frontend (static export)
        working-directory: face-attendance/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          # Use export config for static build (Capacitor APK)
          cp next.config.export.mjs next.config.mjs

          # Temporarily remove API route (incompatible with static export)
          echo "=== Removing API route ==="
          ls -la src/app/api/ || true
          rm -rf src/app/api/backend
          echo "=== After removal ==="
          ls -la src/app/api/ || true

          npm run build

          # Restore API route
          echo "=== Restoring API route ==="
          git checkout HEAD -- src/app/api/backend
          ls -la src/app/api/ || true

      - name: Sync Capacitor Android
        working-directory: face-attendance/frontend
        run: npx cap sync android

      - name: Build Release APK
        working-directory: face-attendance/frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        working-directory: face-attendance/frontend/android
        run: |
          ls -la app/build/outputs/apk/release/
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-attendance-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build debug APK for testing on PRs
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: face-attendance/frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          emulator: false

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        working-directory: face-attendance/frontend
        run: npm ci

      - name: Build frontend (static export)
        working-directory: face-attendance/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          # Use export config for static build (Capacitor APK)
          cp next.config.export.mjs next.config.mjs

          # Temporarily remove API route (incompatible with static export)
          echo "=== Removing API route ==="
          ls -la src/app/api/ || true
          rm -rf src/app/api/backend
          echo "=== After removal ==="
          ls -la src/app/api/ || true

          npm run build

          # Restore API route
          echo "=== Restoring API route ==="
          git checkout HEAD -- src/app/api/backend
          ls -la src/app/api/ || true

      - name: Sync Capacitor Android
        working-directory: face-attendance/frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: face-attendance/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: face-attendance-debug-apk
          path: face-attendance/frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7